name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The tools are checked against these checksums before they run.
env:
  SWIFTFORMAT_VERSION: 0.64.1
  SWIFTFORMAT_SHA256: a291dd7e1e563562565ca18193da0c1aa0578b45973335d827e214b2d2d769ec
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install SwiftFormat
        run: |
          curl -fsSL -o swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat_linux.zip"
          echo "$SWIFTFORMAT_SHA256  swiftformat.zip" | sha256sum --check --strict
          unzip -q swiftformat.zip -d "$RUNNER_TEMP/swiftformat"
          rm swiftformat.zip
          chmod +x "$RUNNER_TEMP"/swiftformat/swiftformat_linux
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"

      - name: SwiftFormat
        run: swiftformat_linux --lint --reporter github-actions-log .

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: Install actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz -C "$RUNNER_TEMP" actionlint
          rm actionlint.tar.gz
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: actionlint
        run: actionlint -color

      - name: Release scripts
        run: ./scripts/test-release-scripts.sh

  build:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build (warnings are errors)
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test --skip-build

      - name: Check Info.plist
        run: plutil -lint Resources/Info.plist

      - name: Build app bundle
        run: ./scripts/bundle.sh

      - name: Verify code signature
        run: codesign --verify --deep --strict --verbose=2 build/PopMac.app

      # Launches the app without touching windows. A private API symbol that is
      # missing on this macOS version makes dyld fail here.
      - name: Smoke test
        run: |
          build/PopMac.app/Contents/MacOS/PopMac --version
          build/PopMac.app/Contents/MacOS/PopMac --diagnose

      - name: Package app
        run: ditto -c -k --keepParent build/PopMac.app PopMac.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PopMac
          path: PopMac.zip
          if-no-files-found: error
