name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The default shell has no pipefail, so a failing command in a pipe would go unnoticed.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The tools are checked against these checksums before they run.
env:
  SWIFTFORMAT_VERSION: 0.64.1
  SWIFTFORMAT_SHA256: a291dd7e1e563562565ca18193da0c1aa0578b45973335d827e214b2d2d769ec
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  ZIZMOR_VERSION: 1.31.1
  ZIZMOR_SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install SwiftFormat
        run: |
          curl -fsSL -o swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat_linux.zip"
          echo "$SWIFTFORMAT_SHA256  swiftformat.zip" | sha256sum --check --strict
          unzip -q swiftformat.zip -d "$RUNNER_TEMP/swiftformat"
          rm swiftformat.zip
          chmod +x "$RUNNER_TEMP"/swiftformat/swiftformat_linux
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"

      - name: SwiftFormat
        run: swiftformat_linux --lint --reporter github-actions-log .

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: Install actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz -C "$RUNNER_TEMP" actionlint
          rm actionlint.tar.gz
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: actionlint
        run: actionlint -color

      - name: Install zizmor
        run: |
          curl -fsSL -o zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ZIZMOR_SHA256  zizmor.tar.gz" | sha256sum --check --strict
          tar -xzf zizmor.tar.gz -C "$RUNNER_TEMP" zizmor
          rm zizmor.tar.gz

      # Finds security problems in the workflows, such as script injection or
      # unpinned actions. Online, it also checks that each pinned commit belongs to its action.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/zizmor" --format github .github/workflows'

      - name: Release scripts
        run: ./scripts/test-release-scripts.sh

      - name: Doc links
        run: python3 scripts/check-links.py

  build:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build (warnings are errors)
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test --skip-build

      - name: Check Info.plist
        run: plutil -lint Resources/Info.plist

      - name: Build app bundle
        run: ./scripts/bundle.sh

      - name: Verify code signature
        run: codesign --verify --deep --strict --verbose=2 build/PopMac.app

      # Launches the app without touching windows. A private API symbol that is
      # missing on this macOS version makes dyld fail here.
      - name: Smoke test
        run: |
          build/PopMac.app/Contents/MacOS/PopMac --version
          build/PopMac.app/Contents/MacOS/PopMac --diagnose

      - name: Check the minimum macOS
        run: ./scripts/check-min-macos.sh

      # Homebrew checks casks only inside a tap, so the cask goes into a throwaway one,
      # with a placeholder version and checksum.
      - name: Check the Homebrew cask
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: |
          brew tap-new --no-git popmac/check
          tap="$(brew --repository popmac/check)"
          mkdir -p "$tap/Casks"
          sed -e "s/@VERSION@/0.0.0/" -e "s/@SHA256@/$(printf '0%.0s' {1..64})/" packaging/homebrew/pop-mac.rb > "$tap/Casks/pop-mac.rb"
          if brew commands | grep -qx trust; then brew trust popmac/check; fi
          brew style --cask popmac/check/pop-mac
          brew audit --cask --strict popmac/check/pop-mac

      - name: Package app
        run: ditto -c -k --keepParent build/PopMac.app PopMac.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PopMac
          path: PopMac.zip
          if-no-files-found: error

  # Launches the app from the build job on older macOS, which catches APIs and
  # private symbols that are missing there. The build needs the newest Xcode,
  # which runs only on the newest macOS. Remove macos-14 when GitHub retires it.
  older-macos:
    name: Smoke test (${{ matrix.runner }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-14]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PopMac

      - name: Smoke test
        run: |
          sw_vers
          ditto -x -k PopMac.zip .
          PopMac.app/Contents/MacOS/PopMac --version
          PopMac.app/Contents/MacOS/PopMac --diagnose

  sanitizers:
    name: Tests with the ${{ matrix.sanitizer }} sanitizer
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test
        run: swift test --sanitize=${{ matrix.sanitizer }} --filter PopCoreTests

  # A report, not a check: how many warnings Swift 6 strict concurrency would turn into errors.
  concurrency:
    name: Swift 6 concurrency report
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build with complete concurrency checking
        run: |
          swift build --build-tests -Xswiftc -strict-concurrency=complete 2>&1 | tee build.log
          grep -E '^/.*: warning:' build.log | sort -u > warnings.txt || true
          {
            echo "### Swift 6 concurrency"
            echo
            echo "$(wc -l < warnings.txt | tr -d ' ') warnings would be errors in the Swift 6 language mode."
            echo
            echo '```'
            sed -E "s#^$PWD/##" warnings.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
